# InsightFlow, nginx part 1 of 2: plain HTTP. TEMPLATE for nginx 1.24 (Ubuntu 24.04).
# Replace INSIGHTFLOW_HOSTNAME, then see deploy/README.md, "HTTPS and sign-in", for the order of the steps:
# this file is enabled first, so Let's Encrypt can check the host name before any certificate exists.
# Not tested against a live nginx in this repository: always run `sudo nginx -t` before reloading.

# Requests for any other name, or for the bare IP address, get no answer (444 closes the connection).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name INSIGHTFLOW_HOSTNAME;
    server_tokens off;

    # Let's Encrypt's HTTP-01 check (certbot --webroot -w /var/www/letsencrypt). No sign-in, no app files here.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Everything else moves to HTTPS. Credentials are never sent over plain HTTP.
    location / {
        return 301 https://$host$request_uri;
    }
}
