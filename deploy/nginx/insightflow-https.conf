# InsightFlow, nginx part 2 of 2: HTTPS, owner-only sign-in, limits, the built frontend, and /api to Uvicorn.
# TEMPLATE for nginx 1.24 (Ubuntu 24.04). Replace every INSIGHTFLOW_HOSTNAME, and enable this file only after the
# certificate exists (deploy/README.md, "HTTPS and sign-in"). Always run `sudo nginx -t` before reloading.
# Not tested against a live nginx in this repository.
#
# The sign-in below gives the owner, and only the owner, access to the whole site. It is not per-user access
# control inside the app: InsightFlow has no accounts, and anyone with these credentials sees and can delete
# every saved dataset. Because browsers send the credentials automatically, cross-site requests that change
# something are refused separately (below, and again in the app).

# ---------- Limits (shared memory zones; defined once, in the http context) ----------

# All requests per client address. One analysis sends about six API requests at once, so bursts are allowed.
limit_req_zone $binary_remote_addr zone=insightflow_requests:10m rate=10r/s;

# POST requests (uploads, saves, analyses) per client address. Other methods map to "" and are not counted.
map $request_method $insightflow_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $insightflow_post_key zone=insightflow_posts:10m rate=30r/m;

limit_conn_zone $binary_remote_addr zone=insightflow_connections:10m;

# ---------- Cross-site request protection ----------
# The browser sends the sign-in credentials with every request to the site, including forms another website
# submits. So a request that changes something (any method but GET, HEAD, OPTIONS) is refused with 403 when
# Sec-Fetch-Site says it came from another site, or Origin is not this site. Requests with neither header come
# from non-browser clients (curl, scripts) and pass. The API applies the same rules itself
# (backend/app/api/cross_site.py), deriving the allowed origin from ALLOWED_HOSTS; this copy only differs in being
# stricter about spelling (exact lower-case values, no explicit :443).

map $request_method $insightflow_changes_state {
    GET     0;
    HEAD    0;
    OPTIONS 0;
    default 1;
}
map $http_sec_fetch_site $insightflow_fetch_site_ok {
    ""          1;
    same-origin 1;
    none        1;
    default     0;
}
map $http_origin $insightflow_origin_ok {
    ""                             1;
    "https://INSIGHTFLOW_HOSTNAME" 1;
    default                        0;
}
map "$insightflow_changes_state$insightflow_fetch_site_ok$insightflow_origin_ok" $insightflow_cross_site {
    111     0;    # changes state, both checks pass (exact matches are tried before regular expressions)
    ~^1     1;    # changes state, a check fails
    default 0;    # GET, HEAD, OPTIONS
}

# ---------- HTTPS for any other name: refuse the TLS handshake ----------

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# ---------- The site ----------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name INSIGHTFLOW_HOSTNAME;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/INSIGHTFLOW_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/INSIGHTFLOW_HOSTNAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:insightflow_tls:10m;
    ssl_session_timeout 1d;

    # Owner-only sign-in on every path: the frontend files and the API. The password file holds one line per
    # person (here: only the owner), created as described in deploy/README.md. Never commit it.
    auth_basic "InsightFlow";
    auth_basic_user_file /etc/nginx/insightflow.htpasswd;

    # Sizes and timeouts. FastAPI enforces the exact upload limit (MAX_UPLOAD_MB plus 256 KB of form overhead);
    # this stops anything clearly larger before it is stored. Raise both together.
    client_max_body_size 11m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 30s;

    # Rate and connection limits. Rejected requests get 429, which the page explains. Failed sign-ins count too,
    # because limits are checked before the password.
    limit_req zone=insightflow_requests burst=40 nodelay;
    limit_conn insightflow_connections 20;
    limit_req_status 429;
    limit_conn_status 429;

    # Security headers. Kept at server level only: nginx drops these if a location adds its own add_header.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # ---------- The built frontend (npm run build -> frontend/dist) ----------

    root /opt/insightflow/current/frontend/dist;
    index index.html;

    # The page itself is always revalidated, so a new release is picked up at once.
    location = /index.html {
        expires -1;
    }

    # Built files carry a content hash in their names, so they can be cached.
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # Pages are addressed with #/... links, so every other path serves the app.
    location / {
        try_files $uri /index.html;
    }

    # ---------- The API ----------

    # Readiness is checked on the server itself (curl http://127.0.0.1:8000/api/health/ready), not from outside.
    location = /api/health/ready {
        return 404;
    }

    location /api/ {
        # Cross-site protection (see the maps at the top). `if` with only `return` inside is safe in nginx.
        if ($insightflow_cross_site) {
            return 403;
        }

        # limit_req set here replaces the server-level one, so both zones are listed.
        limit_req zone=insightflow_requests burst=40 nodelay;
        limit_req zone=insightflow_posts burst=12 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;                 # must be listed in ALLOWED_HOSTS
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx receives the whole (size-limited) body before passing it on.
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;                     # the page itself gives up after 120 s
    }
}
